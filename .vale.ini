# Docs follow the Google developer documentation style guide, checked by
# Vale. Run `vale sync` once to download the styles. See
# https://github.com/hyperjump-io/hyperjump.io/tree/main/design/style
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google, proselint, Harper, A11y, https://hyperjump.io/vale/Hyperjump.zip

# Every file: no styles, unless a later section turns them on. Harper's
# package turns itself on in its own [*] section, and a [*] section here
# would add to it instead of replacing it, so this one is [**]. The rule
# below is wrong for these docs. See the link above.
[**]
BasedOnStyles =
Harper.NumericRangeEnDash = NO

[website/**/*.md]
BasedOnStyles = Vale, Google, proselint, Harper, A11y

[design/**/*.md]
BasedOnStyles = Vale, proselint, Harper, A11y
